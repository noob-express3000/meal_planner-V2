name: Import Meal Planner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-meal-planner.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source snapshot
        run: git clone --depth 1 --branch main https://github.com/noob-express3000/meal_planner.git /tmp/meal-planner-source

      - name: Replace destination working tree
        shell: bash
        run: |
          rsync -a --delete --exclude='.git' --exclude='.github/workflows' /tmp/meal-planner-source/ ./
          rm -rf .git/modules || true

      - name: Commit copied snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Destination already matches meal_planner/main outside workflow files.'
            exit 0
          fi
          git commit -m 'Copy meal_planner main snapshot for AI Builders'
          git push origin HEAD:main
