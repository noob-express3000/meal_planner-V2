<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>The Watchlist</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main class="shell">
    <span id="agent-status" class="agent-status" aria-live="polite" title="WebMCP unavailable">
      <svg class="webmcp-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="6" cy="12" r="2.25"></circle>
        <circle cx="18" cy="6" r="2.25"></circle>
        <circle cx="18" cy="18" r="2.25"></circle>
        <path d="M8 11.2 15.8 7M8 12.8l7.8 4.2"></path>
      </svg>
      <span class="sr-only">WebMCP status</span>
    </span>

    <div id="goal" class="goal" hidden></div>

    <nav class="tabs" role="tablist" aria-label="Watchlist views">
      <button class="tab active" id="tab-up-next" role="tab" aria-selected="true" aria-controls="panel-up-next" data-tab="up-next" type="button">Up next</button>
      <button class="tab" id="tab-watchlist" role="tab" aria-selected="false" aria-controls="panel-watchlist" data-tab="watchlist" type="button">Watchlist <span id="queue-count" class="count"></span></button>
      <button class="tab" id="tab-history" role="tab" aria-selected="false" aria-controls="panel-history" data-tab="history" type="button">History <span id="history-count" class="count"></span></button>
    </nav>

    <div class="workspace">
      <section class="tab-panel active" id="panel-up-next" role="tabpanel" aria-labelledby="tab-up-next" data-panel="up-next">
        <div id="up-next" class="panel-content"></div>
      </section>

      <section class="tab-panel" id="panel-watchlist" role="tabpanel" aria-labelledby="tab-watchlist" data-panel="watchlist" hidden>
        <div id="watchlist" class="panel-content media-grid"></div>
      </section>

      <section class="tab-panel" id="panel-history" role="tabpanel" aria-labelledby="tab-history" data-panel="history" hidden>
        <div id="history" class="panel-content media-grid"></div>
      </section>
    </div>
  </main>

  <template id="hero-template">
    <article class="hero">
      <div class="poster hero-poster"></div>
      <div class="hero-copy">
        <div class="meta"></div>
        <h1 class="title"></h1>
        <p class="reason"></p>
        <div class="actions"></div>
      </div>
    </article>
  </template>

  <template id="card-template">
    <article class="media-card">
      <div class="poster card-poster"></div>
      <div class="card-copy">
        <div class="meta"></div>
        <h2 class="title"></h2>
        <div class="actions"></div>
      </div>
    </article>
  </template>

  <script src="/assets/app.js" defer></script>
</body>
</html>
